 else if(route==='source'&&sources[id]){const s=sources[id],back=['eat','cook'].includes(from)?from:'home';view.innerHTML=`<a class="back" href="#${back}">← 返回${back==='cook'?'屋企煮':back==='eat'?'出去食':'首頁'}</a><div class="eyebrow">${esc(s.type)}</div><h1>${esc(s.title)}</h1><p class="muted">${esc(s.credit)}</p><div class="card"><h2>去原頁繼續睇</h2><p>${back==='cook'?'入原頁查清楚配方份量、所需材料同做法，先決定跟邊款。':'原作者或機構網站會提供該頁內容。'}</p><a class="button primary external" href="${s.url}" target="_blank" rel="noopener noreferrer">開原文（新分頁） ↗</a><p class="muted">睇完關閉新分頁，會返到呢度。外部網站有各自嘅私隱及使用條款。</p></div><div class="secondary row"><a class="button" href="#${back}">返去揀其他來源</a><a class="button" href="#record/${back}">記低今餐</a></div>`;}
 else if(route==='health'){const back=['eat','cook'].includes(id)?id:'home';view.innerHTML=`<a class="back" href="#${back}">← 返回${back==='cook'?'屋企煮':back==='eat'?'出去食':'首頁'}</a><div class="eyebrow">睇清楚，再比較</div><h1>個數字係邊一份？</h1><p class="muted">食安中心同消委會喺 2017 年收集嘅 10 個雲吞幼麵樣本，連湯每 100 克平均含 380 毫克鈉。當年嘅樣本結果未能代表你今日食嗰碗。</p><div class="stack">${['sodium','child','allergy'].map(k=>linkCard(k,back)).join('')}</div><div class="note">研究以連湯重量計。比較唔同數字時，先睇清楚係每 100 克、每碗定淨麵。</div>`;}
 else if(route==='record'){const origin=['eat','cook'].includes(id)?id:lastScene;const result=catalogue.get(from);view.innerHTML=`<a class="back" href="#${origin}">← 返回${origin==='cook'?'屋企煮':'出去食'}</a><div class="eyebrow">食完記低</div><h1>今餐有咩想記住？</h1><p class="muted">只儲存喺呢個瀏覽器，唔會傳送到網站伺服器。</p><form id="record-form" class="form"><label for="dish">食咗啲乜</label><input id="dish" name="dish" value="${esc(result?.dish??"雲吞麵")}" maxlength="100" required><label for="origin">今次係</label><select id="origin" name="origin"><option value="cook" ${origin==='cook'?'selected':''}>自己煮</option><option value="eat" ${origin==='eat'?'selected':''}>出去食</option></select><label for="place">喺邊食／跟邊個方向煮（可留空）</label><input id="place" name="place" value="${esc(result?.place??"")}" maxlength="160" placeholder="例如：屋企、作者名或餐廳名"><label for="feeling">今次感覺</label><select id="feeling" name="feeling"><option>想再食</option><option>普通</option><option>未啱口味</option></select><label for="notes">下次記住（可留空）</label><textarea id="notes" name="notes" maxlength="500" placeholder="例如：今次材料、想調整嘅地方"></textarea><p id="save-status" role="status"></p><button class="primary">儲存試用記錄</button></form><div class="note">呢度係獨立試用記錄，唔會讀取或改動你原有嘅飲食記錄同相片。清理瀏覽資料或換瀏覽器後，試用記錄唔會跟住過去。</div>`;}
 else if(route==='saved'){let records=[],error='';try{records=readRecords();}catch{error='暫時讀唔到試用記錄，未有改動已儲存內容。';}view.innerHTML=`<a class="back" href="#home">← 返首頁</a><div class="eyebrow">呢個瀏覽器嘅試用記錄</div><h1>下次再搵返</h1><p role="status">${error||'記錄只留喺本機，冇同步到原網站。'}</p><div class="stack">${records.length?records.slice().reverse().map(r=>`<article class="card saved"><span class="pill">${r.origin==='cook'?'自己煮':'出去食'}</span><h2>${esc(r.dish)}</h2><p>${esc(r.place)}${r.place?' · ':''}${esc(r.feeling)}</p><p>${esc(r.notes)}</p><small class="muted">${esc(new Date(r.at).toLocaleString('zh-HK'))}</small><div class="record-actions"><a class="button" href="#${catalogue.has(r.resultId)?"result/"+r.resultId+"/"+(r.origin==="cook"?"cook":"eat"):r.origin==="cook"?"cook":"eat"}">再搵呢個方向 →</a></div></article>`).join(''):'<div class="card">仲未有試用記錄。<br><a class="button" href="#record">記低第一餐</a></div>'}</div>`;}
 else{go('#home');return;}
 view.focus({preventScroll:true});window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-query]');if(b){queries[lastScene]=b.dataset.query;notice='';render();}});
document.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);if(e.target.id==='search'){queries[lastScene]=String(data.get('query')).trim();notice='';render();}else if(e.target.id==='record-form'){try{const rows=readRecords(),origin=data.get('origin')==='eat'?'eat':'cook';rows.push({at:new Date().toISOString(),dish:String(data.get('dish')).slice(0,100),origin,place:String(data.get('place')).slice(0,160),feeling:String(data.get('feeling')),notes:String(data.get('notes')).slice(0,500),resultId:catalogue.has(location.hash.split('/')[2])?location.hash.split('/')[2]:null});localStorage.setItem(STORAGE,JSON.stringify(rows));lastScene=origin;go('#saved');}catch{document.getElementById('save-status').textContent='呢個瀏覽器暫時未能儲存。請先複製你想記低嘅文字；原有資料未有清除。';}}});
window.addEventListener('hashchange',render);render();
</script></body></html>
