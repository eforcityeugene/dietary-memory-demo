<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>雲吞麵｜今餐點食？</title>
<style>
:root{color-scheme:light;--paper:#f8f5ed;--card:#fffdf8;--ink:#193c34;--muted:#5d6c60;--line:#d9dfd2;--orange:#ad482b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}a{color:var(--ink)}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 19px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;font-weight:650}button:hover,.button:hover{border-color:var(--ink);background:#edf0e7}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover{background:#31574a;color:white}header{max-width:1080px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.wordmark{font-size:20px;letter-spacing:2px;text-decoration:none;font-weight:800}.edition{font-size:13px;color:var(--muted)}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{font-size:14px;text-decoration:none;padding:9px 12px;border-radius:9px}nav a[aria-current=page]{background:var(--ink);color:white}main{max-width:1040px;min-height:65vh;margin:auto;padding:42px 24px 64px}.eyebrow{color:var(--orange);letter-spacing:2px;font-size:13px;font-weight:800}h1{font-size:clamp(30px,5vw,49px);letter-spacing:-1px;line-height:1.25;margin:12px 0 17px}h2{font-size:24px;line-height:1.4;margin:0 0 12px}h3{font-size:19px;margin:0 0 8px}p{margin:10px 0 18px}.muted{color:var(--muted)}.hero{max-width:750px;margin-bottom:34px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:24px;box-shadow:0 5px 20px #193c3405}.card .number{font-size:12px;letter-spacing:2px;color:var(--orange);font-weight:800}.card h2{margin-top:16px}.card p{font-size:15px}.card .button{width:100%;margin-top:10px}.stack{display:grid;gap:14px}.source{display:flex;align-items:center;justify-content:space-between;gap:20px}.source p{margin:4px 0 0;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.search{display:flex;gap:10px;max-width:780px;margin:24px 0 12px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #b8c5b7;border-radius:10px;color:var(--ink);background:white}label{display:block;font-size:15px;font-weight:650;margin:19px 0 7px}textarea{min-height:110px;resize:vertical}.form{max-width:640px}.note{padding:17px 20px;background:#edf0e5;border-radius:13px;color:#3f5746;font-size:14px;margin:22px 0}.pill{font-size:13px;border-radius:30px;padding:6px 11px;background:#e9eee3;display:inline-block}.back{display:inline-block;margin-bottom:21px}.listhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:30px 0 14px}.secondary{margin-top:26px}.saved{white-space:pre-wrap;overflow-wrap:anywhere}.record-actions{display:flex;gap:10px;margin-top:18px}footer{max-width:1040px;margin:auto;padding:22px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}:focus-visible{outline:3px solid #bd5c38}button:disabled{opacity:.5;cursor:default}@media(max-width:720px){header{padding:16px;align-items:flex-start;flex-direction:column;gap:10px}nav{gap:0}nav a{padding:8px 11px}main{padding:26px 17px 44px}.grid{grid-template-columns:1fr}.card{padding:20px}.source{align-items:flex-start;flex-direction:column;gap:12px}.source .button{width:100%}.search{flex-wrap:wrap}.search button{width:100%}.listhead{align-items:flex-start;flex-direction:column}.row button{font-size:14px;padding:8px 12px}.record-actions{flex-direction:column}}
</style></head><body>
<header><div><a class="wordmark" href="#home">飲食・今餐</a><div class="edition">雲吞麵小試版</div></div><nav aria-label="主要場景"><a href="#eat" data-nav="eat">出去食</a><a href="#cook" data-nav="cook">屋企煮</a><a href="#record" data-nav="record">食完記低</a></nav></header>
<main id="view" tabindex="-1"></main><footer>呢個試用頁用原文連結帶你繼續查。記錄只留喺你目前嘅瀏覽器，唔會同步到原有飲食記錄。<br>版本：雲吞麵連結試用 2026-11-07</footer>
<script>
'use strict';
const STORAGE='dm.wontonTrial.v1';
const sources={
 ho:{title:'何洪記（銅鑼灣）',credit:'MICHELIN Guide 原頁',url:'https://guide.michelin.com/hk/en/hong-kong-region/hong-kong/restaurant/ho-hung-kee',type:'餐廳介紹'},
 mak:{title:"Mak’s Noodle",credit:'香港旅遊發展局原頁',url:'https://www.discoverhongkong.com/eng/place-to-go/travel.guide-mak-s-noodle.html',type:'餐廳介紹'},
 lau:{title:'Daddy Lau',credit:'Made With Lau · Wonton Noodle Soup',url:'https://www.madewithlau.com/recipes/wonton-noodle-soup',type:'作者食譜'},
 christie:{title:'Christie Lai',credit:'Christie at Home · Wonton Noodle Soup',url:'https://christieathome.com/blog/wonton-noodle-soup/',type:'作者食譜'},
 rasa:{title:'Rasa Malaysia',credit:'Wonton Noodles · 原方及署名見原頁',url:'https://rasamalaysia.com/wonton-noodles/',type:'乾撈方向原頁'},
 sodium:{title:'湯粉麵鈉與能量研究',credit:'香港食物安全中心 · 研究摘要',url:'https://www.cfs.gov.hk/tc_chi/programme/programme_rafs/programme_rafs_n_01_24_abstract.html',type:'官方研究'},
 child:{title:'Asian Wanton Mee',credit:'HealthHub Singapore · 兒童配方原PDF',url:'https://ch-api.healthhub.sg/api/public/content/45e8fb68b26b493d80525118fd8dc482?v=4e2de404',type:'官方配方'},
 allergy:{title:'慎防食物中的致敏物',credit:'香港食物安全中心原頁',url:'https://www.cfs.gov.hk/tc_chi/multimedia/multimedia_pub/multimedia_pub_fsf_231_04.html',type:'官方資訊'}
};
const queries={eat:'雲吞麵',cook:'雲吞麵'},view=document.getElementById('view');let lastScene='cook',notice='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readRecords(){const raw=localStorage.getItem(STORAGE);if(!raw)return [];const rows=JSON.parse(raw);if(!Array.isArray(rows))throw Error('invalid trial records');return rows;}
function linkCard(id,from){const s=sources[id];return `<article class="card source"><div><h3>${esc(s.title)}</h3><p class="muted">${esc(s.credit)}</p></div><a class="button" href="#source/${id}/${from}">睇原文入口 →</a></article>`;}
function go(hash){if(location.hash===hash)render();else location.hash=hash;}
function render(){
 const [route='home',id,from]=location.hash.slice(1).split('/'),scene=['eat','cook'].includes(route)?route:null;
 if(scene)lastScene=scene;
 document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===(scene||(['record','saved'].includes(route)?'record':from));if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(route==='home')view.innerHTML=`<section class="hero"><div class="eyebrow">今餐・由你揀</div><h1>一碗雲吞麵，<br>今次想點食？</h1><p class="muted">先揀場景，再去原頁查餐廳或跟作者配方。食完留一句，下次記得返。</p></section><div class="grid"><article class="card"><span class="number">01 / 出去食</span><h2>搵一間試吓</h2><p>由介紹來源開始，去原頁確認分店、菜式同最新資料。</p><a class="button primary" href="#eat">搵餐廳 →</a></article><article class="card"><span class="number">02 / 屋企煮</span><h2>自己煮一碗</h2><p>揀作者原方，睇材料、份量同做法，再決定今次點煮。</p><a class="button primary" href="#cook">搵食譜 →</a></article><article class="card"><span class="number">03 / 食完記低</span><h2>留低今餐感覺</h2><p>記低喺邊食、自己點煮，下次再搵返呢個方向。</p><a class="button" href="#record">記低今餐 →</a></article></div><div class="secondary row"><a href="#health/home">想先了解鈉、份量或致敏物？</a><a href="#saved">睇試用記錄</a></div>`;
 else if(scene){const cook=scene==='cook',q=queries[scene];view.innerHTML=`<a class="back" href="#home">← 返首頁</a><span class="pill">${cook?'屋企煮／食譜':'出去食／餐廳'}</span><h1>${cook?'先揀一份作者原方':'由餐廳介紹開始'}</h1><p class="muted">${cook?'材料、份量、替換選擇同完整做法，請跟作者原頁確認。':'呢度先提供介紹入口；出發前去原頁確認分店及最新資料。'}</p><form id="search" class="search"><label class="sr" for="query">想查啲乜</label><input id="query" name="query" maxlength="160" value="${esc(q)}" required><button class="primary">搵原頁</button></form><div class="row">${(cook?['想睇材料同做法','有蝦冇豬肉','想試乾撈']:['邊個介紹過','想睇分店資料']).map(t=>`<button type="button" data-query="${t}">${t}</button>`).join('')}</div><p role="status" class="muted">${notice?esc(notice):`你而家查緊：${esc(q)}`}</p><div class="listhead"><h2>${cook?'作者原頁':'介紹原頁'}</h2><a href="#health/${scene}">份量、鈉同致敏物 →</a></div><div class="stack">${(cook?['lau','christie','rasa']:['ho','mak']).map(k=>linkCard(k,scene)).join('')}</div><div class="note">本頁係雲吞麵連結試用，唔會喺頁內重刊作者材料、做法、食評或未核實價錢。外部內容以原作者最新版本為準。</div><a class="button" href="#record/${scene}">${cook?'煮完，記低今餐':'食完，記低今餐'} →</a>`;notice='';}
 else if(route==='source'&&sources[id]){const s=sources[id],back=['eat','cook'].includes(from)?from:'home';view.innerHTML=`<a class="back" href="#${back}">← 返回${back==='cook'?'屋企煮':back==='eat'?'出去食':'首頁'}</a><div class="eyebrow">${esc(s.type)}</div><h1>${esc(s.title)}</h1><p class="muted">${esc(s.credit)}</p><div class="card"><h2>去原頁繼續睇</h2><p>${back==='cook'?'入原頁查清楚配方份量、所需材料同做法，先決定跟邊款。':'原作者或機構網站會提供該頁內容。'}</p><a class="button primary external" href="${s.url}" target="_blank" rel="noopener noreferrer">開原文（新分頁） ↗</a><p class="muted">睇完關閉新分頁，會返到呢度。外部網站有各自嘅私隱及使用條款。</p></div><div class="secondary row"><a class="button" href="#${back}">返去揀其他來源</a><a class="button" href="#record/${back}">記低今餐</a></div>`;}
 else if(route==='health'){const back=['eat','cook'].includes(id)?id:'home';view.innerHTML=`<a class="back" href="#${back}">← 返回${back==='cook'?'屋企煮':back==='eat'?'出去食':'首頁'}</a><div class="eyebrow">睇清楚，再比較</div><h1>個數字係邊一份？</h1><p class="muted">先核對原頁嘅份量、對象同日期。唔同配方、連湯或淨麵，唔適合直接當同一碗比較。</p><div class="stack">${['sodium','child','allergy'].map(k=>linkCard(k,back)).join('')}</div><div class="note">本頁只連結官方原文，唔會代你判定某一碗適唔適合你。</div>`;}
 else if(route==='record'){const origin=['eat','cook'].includes(id)?id:lastScene;view.innerHTML=`<a class="back" href="#${origin}">← 返回${origin==='cook'?'屋企煮':'出去食'}</a><div class="eyebrow">食完記低</div><h1>今餐有咩想記住？</h1><p class="muted">只儲存喺呢個瀏覽器，唔會傳送到網站伺服器。</p><form id="record-form" class="form"><label for="dish">食咗啲乜</label><input id="dish" name="dish" value="雲吞麵" maxlength="100" required><label for="origin">今次係</label><select id="origin" name="origin"><option value="cook" ${origin==='cook'?'selected':''}>自己煮</option><option value="eat" ${origin==='eat'?'selected':''}>出去食</option></select><label for="place">喺邊食／跟邊個方向煮（可留空）</label><input id="place" name="place" maxlength="160" placeholder="例如：屋企、作者名或餐廳名"><label for="feeling">今次感覺</label><select id="feeling" name="feeling"><option>想再食</option><option>普通</option><option>未啱口味</option></select><label for="notes">下次記住（可留空）</label><textarea id="notes" name="notes" maxlength="500" placeholder="例如：今次材料、想調整嘅地方"></textarea><p id="save-status" role="status"></p><button class="primary">儲存試用記錄</button></form><div class="note">呢度係獨立試用記錄，唔會讀取或改動你原有嘅飲食記錄同相片。清理瀏覽資料或換瀏覽器後，試用記錄唔會跟住過去。</div>`;}
 else if(route==='saved'){let records=[],error='';try{records=readRecords();}catch{error='暫時讀唔到試用記錄，未有改動已儲存內容。';}view.innerHTML=`<a class="back" href="#home">← 返首頁</a><div class="eyebrow">呢個瀏覽器嘅試用記錄</div><h1>下次再搵返</h1><p role="status">${error||'記錄只留喺本機，冇同步到原網站。'}</p><div class="stack">${records.length?records.slice().reverse().map(r=>`<article class="card saved"><span class="pill">${r.origin==='cook'?'自己煮':'出去食'}</span><h2>${esc(r.dish)}</h2><p>${esc(r.place)}${r.place?' · ':''}${esc(r.feeling)}</p><p>${esc(r.notes)}</p><small class="muted">${esc(new Date(r.at).toLocaleString('zh-HK'))}</small><div class="record-actions"><a class="button" href="#${r.origin==='cook'?'cook':'eat'}">再搵呢個方向 →</a></div></article>`).join(''):'<div class="card">仲未有試用記錄。<br><a class="button" href="#record">記低第一餐</a></div>'}</div>`;}
 else{go('#home');return;}
 view.focus({preventScroll:true});window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-query]');if(b){queries[lastScene]=b.dataset.query;notice='保留你揀嘅場景，去作者／介紹原頁繼續查。';render();}});
document.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);if(e.target.id==='search'){queries[lastScene]=String(data.get('query')).trim();notice='呢版提供雲吞麵原頁入口；你揀嘅場景保持不變。';render();}else if(e.target.id==='record-form'){try{const rows=readRecords(),origin=data.get('origin')==='eat'?'eat':'cook';rows.push({at:new Date().toISOString(),dish:String(data.get('dish')).slice(0,100),origin,place:String(data.get('place')).slice(0,160),feeling:String(data.get('feeling')),notes:String(data.get('notes')).slice(0,500)});localStorage.setItem(STORAGE,JSON.stringify(rows));lastScene=origin;go('#saved');}catch{document.getElementById('save-status').textContent='呢個瀏覽器暫時未能儲存。請先複製你想記低嘅文字；原有資料未有清除。';}}});
window.addEventListener('hashchange',render);render();
</script></body></html>
