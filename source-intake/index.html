<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飲食資料收集 · 試用</title>
<meta name="food-intake-build" content="2026-10-10-r1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#21332d;font:16px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{margin-bottom:8px}p{line-height:1.6}.notice{padding:16px;background:#fff3d3;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;padding:22px;border-radius:16px;margin-top:20px}label{display:block;margin:12px 0 5px;font-size:14px}input,textarea,select{width:100%;padding:10px;border:1px solid #a7b5ae;border-radius:7px;font:inherit}textarea{min-height:110px}button{border:0;border-radius:7px;background:#225c45;color:white;padding:11px 16px;margin:10px 8px 0 0;cursor:pointer}.secondary{background:#e2e8e4;color:#21332d}.danger{background:#98463a}.card{border:1px solid #d7ded9;border-radius:9px;padding:12px;margin:10px 0;cursor:pointer}.card.active{border:2px solid #225c45}.muted{color:#60726a;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}#message{white-space:pre-wrap;color:#9a392f}pre{white-space:pre-wrap;font:14px system-ui}summary{cursor:pointer}a{color:#225c45}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}main{padding:16px}}
</style>
<main><h1>飲食資料收集 · 第一版</h1><p>先保留原稿，再逐項覆核。餐廳介紹與獨立飲食知識分開整理。</p>
<div class="notice">公開試用介面，暫時無登入。你匯入的分析稿只存於這部裝置的瀏覽器，不會上傳或跨裝置同步，也不會自動收集外部資料。清除瀏覽器資料可令記錄遺失，請匯出備份。批准只代表覆核分析稿，原影片仍未核實；記錄及備份並未加密。真手機驗收尚未完成。</div>
<section><h2>1 · 加入文字分析稿</h2><div class="row"><div><label>稿件名稱</label><input id="title" placeholder="例：雲吞分析（合成示例）"></div><div><label>來源 URL（可未知）</label><input id="sourceUrl" placeholder="原影片或文件連結"></div><div><label>發布者／頻道（不代替講者）</label><input id="publisher"></div><div><label>原稿日期（照錄，勿補造）</label><input id="sourceDate"></div></div><label>貼上原稿，或匯入 .txt / .md（上限 2 MB）</label><input id="file" type="file" accept=".txt,.md,text/plain,text/markdown"><textarea id="text" placeholder="每行一項說法。可用明示欄位：發布者：、講者：、餐廳：、分店：、菜式：、日期：、來源：。自動候選只按原稿行分拆，意思與分類由你覆核。"></textarea><button id="import">建立待覆核候選</button><button id="sample" class="secondary">載入合成示例</button><p id="message" role="status"></p></section>
<div class="grid"><section><h2>2 · 待覆核與原稿</h2><label>狀態</label><select id="statusFilter"><option value="pending">待覆核</option><option value="approved">已批准</option><option value="rejected">已拒絕</option><option value="all">全部</option></select><div id="candidates"></div><h3>保留的原始文件</h3><div id="documents"></div></section><section><h2>3 · 編輯逐項證據</h2><div id="editor">選擇左方候選。</div></section></div>
<section><h2>4 · 搜尋已批准記錄</h2><input id="query" placeholder="搜尋菜式、講者、分店、知識或原稿文字"><div id="results"></div><button id="export">匯出完整私人備份 JSON</button><button id="exportReviewed" class="secondary">匯出已批准記錄及其原稿 JSON</button><label>還原本 prototype 匯出的 JSON</label><input id="restore" type="file" accept=".json,application/json"><p class="muted">還原會合併新 ID；重複 ID 保留現有記錄。JSON 不會當作已核實影片資料。</p></section></main>
<script src="core.js"></script><script src="store.js"></script><script src="app.js"></script></html>
